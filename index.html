<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一段私密回忆</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fff1e1,#f9d2d8);font-family:system-ui,'Noto Sans SC',sans-serif;color:#4d3d45}main{width:min(420px,calc(100vw - 48px));padding:36px 30px;border:1px solid #fff;background:#fffdf7d9;border-radius:28px;box-shadow:0 18px 52px #8d52644d;text-align:center}h1{font-size:1.7rem;margin:0 0 10px}p{line-height:1.7;color:#765e69}input{box-sizing:border-box;width:100%;padding:13px 14px;border:2px solid #e8b995;border-radius:13px;font-size:1rem;outline:none}input:focus{border-color:#ff7d9c}button{width:100%;margin-top:13px;padding:13px;border:0;border-radius:13px;background:#ff7d9c;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}#message{min-height:1.4em;color:#bb4f70;font-size:.9rem}</style></head>
<body><main><h1>我和荔枝的散步地图</h1><p>这是一段只留给熟悉的人看的回忆。<br>输入密码，打开地图。</p><input id="password" type="password" autocomplete="current-password" placeholder="输入密码" autofocus><button id="unlock">打开回忆</button><p id="message" role="alert"></p></main>
<script>
const salt=Uint8Array.from(atob('oNd2FouNxMDS4kNALKQFOg=='),c=>c.charCodeAt(0));
const nonce=Uint8Array.from(atob('OW+GI+CcePgwXwm5'),c=>c.charCodeAt(0));
const msg=document.querySelector('#message'); const input=document.querySelector('#password');
async function unlock(){
  const password=input.value; if(!password){msg.textContent='请先输入密码。';return;}
  msg.textContent='正在打开回忆…';
  try{
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const encrypted=await (await fetch('payload.bin',{cache:'no-store'})).arrayBuffer();
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},key,encrypted);
    document.open();document.write(new TextDecoder().decode(plain));document.close();
  }catch(e){msg.textContent='密码不正确，请再试一次。';input.select();}
}
document.querySelector('#unlock').addEventListener('click',unlock); input.addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script></body></html>
